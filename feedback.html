<!DOCTYPE html>
<!-- ================================================================
     鴨鴨命理 — 問題反饋
     表單經 FormSubmit 直接轉寄到 yayamingli.app@gmail.com（免開郵件 App）
     注意：第一次有人送出時，FormSubmit 會寄一封啟用信到收件信箱，
     點擊 Activate 之後表單才會正式生效。
     ================================================================ -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題反饋 — 鴨鴨命理</title>
<meta name="description" content="回報問題或提供建議給鴨鴨命理團隊：選擇 App 與問題類型，填好直接送出。">
<meta name="theme-color" content="#EFE9DA">
<style>
  :root{
    --paper:#EFE9DA; --card:#FAF6EC; --ink:#26231E; --ink-2:#5C574E;
    --seal:#9E3B2E; --line:#DDD3BF; --link:#8A3527; --ok:#4E8A63;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#17150F; --card:#201D16; --ink:#E7E0D0; --ink-2:#A69E8C;
      --seal:#D08A7C; --line:#322E24; --link:#E0A18F; --ok:#7FBD97;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    line-height:1.85; font-size:16px; letter-spacing:.01em;
  }
  .wrap{max-width:680px; margin:0 auto; padding:2.6rem 1.4rem 4rem}
  header{margin-bottom:2rem}
  .brand{display:flex; align-items:center; gap:.7rem; margin-bottom:1.4rem;
    text-decoration:none; color:inherit; width:fit-content}
  .brand img{width:40px; height:40px}
  .brand:hover .brand-name{color:var(--seal)}
  .brand-name{font-size:1.05rem; font-weight:500; letter-spacing:.05em;
    font-family:"Kaiti TC","STKaiti","Songti TC","Noto Serif TC",serif}
  h1{
    font-family:"Kaiti TC","STKaiti","Songti TC","Noto Serif TC",serif;
    font-size:2rem; font-weight:600; margin:.2rem 0 .5rem; letter-spacing:.04em;
  }
  .intro{color:var(--ink-2); margin:.2rem 0 0}
  .ok-banner{
    display:none; margin:1.6rem 0 0; padding:1rem 1.3rem;
    background:color-mix(in srgb, var(--ok) 12%, var(--card));
    border:1px solid var(--ok); border-radius:12px; color:var(--ink);
  }
  .ok-banner.show{display:block}
  fieldset{border:0; margin:2rem 0 0; padding:0}
  legend{
    font-family:"Kaiti TC","STKaiti","Songti TC","Noto Serif TC",serif;
    font-size:1.15rem; font-weight:600; letter-spacing:.03em; padding:0; margin-bottom:.7rem;
  }
  .opts{display:flex; flex-wrap:wrap; gap:.6rem}
  .opts label{
    display:flex; align-items:center; gap:.45rem; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:.5rem 1.05rem; font-size:.95rem; color:var(--ink-2);
    transition:color .15s, border-color .15s, background .15s;
  }
  .opts input{position:absolute; opacity:0; pointer-events:none}
  .opts label:has(input:checked){
    background:var(--seal); border-color:var(--seal); color:var(--paper); font-weight:500;
  }
  .opts label:has(input:focus-visible){outline:2px solid var(--seal); outline-offset:3px}
  textarea{
    width:100%; min-height:9.5em; margin-top:.2rem; resize:vertical;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding: .9rem 1rem; font:inherit; line-height:1.75;
  }
  textarea:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
  .row2{display:flex; gap:.8rem; flex-wrap:wrap}
  .row2 > label{flex:1 1 14rem; display:block; font-size:.95rem; color:var(--ink-2)}
  input[type=text], input[type=email]{
    width:100%; margin-top:.3rem; background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.65rem .9rem; font:inherit;
  }
  input[type=text]:focus-visible, input[type=email]:focus-visible{
    outline:2px solid var(--seal); outline-offset:2px}
  .req{color:var(--seal)}
  .hint{color:var(--ink-2); font-size:.85rem; margin:.5rem 0 0}
  .send{
    margin-top:2rem; display:inline-block; border:0; cursor:pointer;
    background:var(--seal); color:var(--paper); font:inherit; font-size:1.02rem; font-weight:500;
    padding:.7rem 2.2rem; border-radius:999px; letter-spacing:.08em;
  }
  .send:focus-visible{outline:2px solid var(--seal); outline-offset:3px}
  .alt{
    margin-top:2.2rem; padding:1.1rem 1.3rem; background:var(--card);
    border:1px solid var(--line); border-radius:12px; font-size:.92rem; color:var(--ink-2);
  }
  .alt a{color:var(--link); text-underline-offset:3px}
  footer{margin-top:3rem; padding-top:1.4rem; border-top:1px solid var(--line);
    color:var(--ink-2); font-size:.85rem; display:flex; gap:1.2rem; flex-wrap:wrap}
  footer a{color:var(--ink-2)}
  .toast{
    position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%) translateY(1rem);
    background:var(--seal); color:var(--paper); padding:.7rem 1.2rem; border-radius:999px;
    font-size:.92rem; box-shadow:0 8px 24px rgba(60,45,25,.25);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="index.html">
      <img src="image/web/logo.png" alt="">
      <span class="brand-name">鴨鴨命理</span>
    </a>
    <h1>問題反饋</h1>
    <p class="intro">使用上遇到狀況、有想要的功能，或任何想說的話，都歡迎告訴我們。</p>
    <div class="ok-banner" id="okBanner">已收到你的反饋，謝謝！我們會盡快回覆到你填寫的 Email。</div>
  </header>

  <main>
    <form id="fb" action="https://formsubmit.co/yayamingli.app@gmail.com" method="POST">
      <input type="hidden" name="_subject" id="subj" value="鴨鴨命理問題反饋">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" id="nextUrl" value="https://yayamingliapp.github.io/feedback.html?sent=1">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <fieldset>
        <legend>哪一款 App？</legend>
        <div class="opts">
          <label><input type="radio" name="App" value="鴨鴨六爻" checked>鴨鴨六爻</label>
          <label><input type="radio" name="App" value="鴨鴨八字">鴨鴨八字</label>
          <label><input type="radio" name="App" value="鴨鴨六壬">鴨鴨六壬</label>
          <label><input type="radio" name="App" value="官網/其他">官網/其他</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>反饋類型</legend>
        <div class="opts">
          <label><input type="radio" name="類型" value="問題回報" checked>問題回報</label>
          <label><input type="radio" name="類型" value="功能建議">功能建議</label>
          <label><input type="radio" name="類型" value="購買/恢復問題">購買/恢復問題</label>
          <label><input type="radio" name="類型" value="其他">其他</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>裝置資訊（問題回報時建議填寫）</legend>
        <div class="opts" style="margin-bottom:.8rem">
          <label><input type="radio" name="手機" value="iPhone" checked>iPhone</label>
          <label><input type="radio" name="手機" value="Android">Android</label>
        </div>
        <div class="row2">
          <label>手機型號
            <input type="text" name="手機型號" id="device" placeholder="例如 iPhone 15">
          </label>
          <label>系統版本
            <input type="text" name="系統版本" id="osver" placeholder="例如 iOS 26">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>聯絡 Email<span class="req"> *</span></legend>
        <input type="email" name="email" id="email" required placeholder="我們會回覆到這個信箱">
      </fieldset>

      <fieldset>
        <legend>想告訴我們的內容<span class="req"> *</span></legend>
        <textarea name="內容" id="msg" required placeholder="請描述遇到的狀況或建議。若是問題回報，寫下操作步驟會很有幫助。"></textarea>
      </fieldset>

      <button class="send" type="submit">送出反饋</button>
      <p class="hint">送出後我們會直接收到你的反饋，並回覆到你填寫的 Email，通常在 2～3 個工作天內。</p>
    </form>

    <div class="alt">
      也可以直接寫信到
      <a href="mailto:yayamingli.app@gmail.com">yayamingli.app@gmail.com</a>，
      或透過 <a href="https://lin.ee/oSstUCa" target="_blank" rel="noopener">LINE 官方帳號</a> 傳訊息給我們。
    </div>
  </main>

  <footer>
    <a href="index.html">← 返回鴨鴨命理</a>
    <a href="privacy.html">隱私政策</a>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var fb = document.getElementById('fb');
var toastEl = document.getElementById('toast'), toastTimer;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
}

// 平台切換時更新提示文字
Array.prototype.forEach.call(fb.elements['手機'], function (r) {
  r.addEventListener('change', function () {
    var ios = fb.elements['手機'].value === 'iPhone';
    document.getElementById('device').placeholder = ios ? '例如 iPhone 15' : '例如 Pixel 8、Galaxy S24';
    document.getElementById('osver').placeholder = ios ? '例如 iOS 26' : '例如 Android 15';
  });
});

// 本機測試時將 _next 改回目前網址
if (location.hostname === 'localhost' || location.protocol === 'file:') {
  document.getElementById('nextUrl').value = location.href.split('?')[0] + '?sent=1';
}

// AJAX 失敗退回原生提交並導回 ?sent=1 時顯示感謝訊息
if (new URLSearchParams(location.search).get('sent') === '1') {
  document.getElementById('okBanner').classList.add('show');
  toast('已收到你的反饋，謝謝！');
  history.replaceState(null, '', location.pathname);
}

fb.addEventListener('submit', function (e) {
  // 蜜罐有值代表機器人 靜默不送
  var honey = fb.querySelector('input[name="_honey"]');
  if (honey && honey.value) { e.preventDefault(); return; }
  if (!fb.reportValidity()) return; // 交給瀏覽器原生必填提示

  document.getElementById('subj').value =
    '[' + fb.elements['App'].value + '] ' + fb.elements['類型'].value;

  e.preventDefault();
  var btn = fb.querySelector('button[type="submit"]');
  btn.disabled = true; btn.style.opacity = '.6';

  fetch('https://formsubmit.co/ajax/yayamingli.app@gmail.com', {
    method: 'POST',
    headers: { 'Accept': 'application/json' },
    body: new FormData(fb)
  })
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function () {
    fb.reset();
    document.getElementById('okBanner').classList.add('show');
    toast('已收到你的反饋，謝謝！');
    btn.disabled = false; btn.style.opacity = '';
  })
  .catch(function () {
    // AJAX 失敗時退回原生提交 會導向 _next
    btn.disabled = false; btn.style.opacity = '';
    fb.submit();
  });
});
</script>
</body>
</html>
